# Use este issuer para testar a emissão sem estourar o rate limit do Let's Encrypt
# (troque a annotation do Ingress para letsencrypt-staging; o certificado não é confiável).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com   # TODO: e-mail da equipe
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
