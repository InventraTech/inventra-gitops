# Acesso pelo IP público (Elastic IP) em HTTP, sem nome DNS e sem certificado.
# IngressRoute do Traefik (e não Ingress) porque o destino é um TraefikService com pesos,
# que divide o tráfego entre a versão estável e a canary durante o rollout.
# Sem `host` nem `entryPoints`, atende qualquer requisição; o Ingress do Argo CD em /argocd
# continua funcionando porque a regra mais longa tem prioridade.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inventra-api
spec:
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: inventra-api-traefik
          kind: TraefikService
---
# Sem `weight`: quem define os pesos é o Argo Rollouts. Fixar um valor aqui deixaria o
# Argo CD sempre OutOfSync.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: inventra-api-traefik
spec:
  weighted:
    services:
      - name: inventra-api
        port: 80
      - name: inventra-api-canary
        port: 80
