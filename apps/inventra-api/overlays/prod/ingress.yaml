# Acesso pelo IP público (Elastic IP) em HTTP, sem nome DNS e sem certificado.
# Sem `host`, o Traefik atende qualquer requisição que chegue na porta 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventra-api
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventra-api
                port:
                  name: http
