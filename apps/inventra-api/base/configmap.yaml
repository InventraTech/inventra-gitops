# Configuração NÃO secreta. Credenciais ficam no SealedSecret "inventra-api-secrets"
# (ver README, seção "Segredos").
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventra-api-config
data:
  PORT: "8080"
  SWAGGER_ENABLED: "true"
  JPA_SHOW_SQL: "false"
  BATCH_EXPIRATION_JOB_ENABLED: "true"
  JWT_EXPIRATION_MS: "86400000"
  REDIS_SSL: "true"
  REDIS_DATABASE: "0"
  # REDIS_HOST/PORT/USERNAME/PASSWORD, SENDGRID_API_KEY, MAIL_FROM e PASSWORD_RESET_WEB_URL vêm do SealedSecret.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
