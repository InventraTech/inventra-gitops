# Rollout (Argo Rollouts) em vez de Deployment: deploy canary com o tráfego dividido pelo Traefik.
# A versão nova recebe 25% → 50% → 75% → 100% do tráfego, 5 minutos em cada passo. Se o pod novo
# não ficar Ready, o rollout não avança e a versão estável continua com o tráfego.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inventra-api
  labels:
    app.kubernetes.io/name: inventra-api
spec:
  replicas: 1
  strategy:
    canary:
      stableService: inventra-api
      canaryService: inventra-api-canary
      trafficRouting:
        traefik:
          # TraefikService do overlay; o controller ajusta os pesos dele a cada passo.
          weightedTraefikServiceName: inventra-api-traefik
      steps:
        - setWeight: 25
        - pause: {duration: 5m}
        - setWeight: 50
        - pause: {duration: 5m}
        - setWeight: 75
        - pause: {duration: 5m}
  selector:
    matchLabels:
      app.kubernetes.io/name: inventra-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventra-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # A tag real é definida no overlay (kustomize images) pelo CD.
          image: ghcr.io/inventratech/inventra-api:v0.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: inventra-api-config
            - secretRef:
                name: inventra-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 640Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Spring Boot demora para subir em CPU pequena; a startupProbe evita que a
          # liveness mate o pod durante o boot.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
