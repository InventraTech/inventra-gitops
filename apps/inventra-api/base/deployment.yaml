apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventra-api
  labels:
    app.kubernetes.io/name: inventra-api
spec:
  replicas: 1
  # Sem staging, o rolling update é a rede de segurança: o pod novo só recebe tráfego
  # depois de ficar Ready; se não ficar, o antigo continua servindo.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: inventra-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventra-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # A tag real é definida no overlay (kustomize images) pelo CD.
          image: ghcr.io/inventratech/inventra-api:v0.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: inventra-api-config
            - secretRef:
                name: inventra-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 640Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Spring Boot demora para subir em CPU pequena; a startupProbe evita que a
          # liveness mate o pod durante o boot.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
