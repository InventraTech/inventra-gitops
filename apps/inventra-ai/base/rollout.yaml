# Rollout (Argo Rollouts) com canary, igual ao da API: 25% → 50% → 75% → 100% do tráfego,
# 5 minutos em cada passo, dividido pelo Traefik. Se o pod novo não ficar Ready, o rollout
# não avança e a versão estável continua com o tráfego.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inventra-ai
  labels:
    app.kubernetes.io/name: inventra-ai
spec:
  replicas: 1
  strategy:
    canary:
      stableService: inventra-ai
      canaryService: inventra-ai-canary
      trafficRouting:
        traefik:
          # TraefikService do overlay; o controller ajusta os pesos dele a cada passo.
          weightedTraefikServiceName: inventra-ai-traefik
      steps:
        - setWeight: 25
        - pause: {duration: 5m}
        - setWeight: 50
        - pause: {duration: 5m}
        - setWeight: 75
        - pause: {duration: 5m}
  selector:
    matchLabels:
      app.kubernetes.io/name: inventra-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventra-ai
    spec:
      securityContext:
        runAsNonRoot: true
        # Mesmo UID do `adduser -u 10001` do Dockerfile da IA.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai
          # A tag real é definida no overlay (kustomize images) pelo CD.
          image: ghcr.io/inventratech/inventra-ai:v0.0.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: inventra-ai-config
            - secretRef:
                name: inventra-ai-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /health responde 200 mesmo com o Mongo fora ("degraded"), então não derruba o pod por isso.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
