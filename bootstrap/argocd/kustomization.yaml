apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Versão pinada: atualizar via PR e reaplicar com `kubectl apply -k bootstrap/argocd`.
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.0.0/manifests/install.yaml
  - ingress.yaml

patches:
  # O TLS é terminado no Traefik; o argocd-server fala HTTP por trás dele.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
