apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Versão pinada: atualizar via PR e reaplicar com `kubectl apply -k bootstrap/argocd`.
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.0.0/manifests/install.yaml

patches:
  # argocd-server em HTTP puro: a UI não fica pública, é acessada por port-forward/Tailscale.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
