apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventra-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/dvarakaki/inventra-gitops.git
    targetRevision: main
    path: apps/inventra-api/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: inventra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
